services:
  api:
    build: .
    image: shopsmart-api:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/shopsmart.db
      CHROMA_DIR: /app/data/chroma
      LOG_DIR: /app/logs
    volumes:
      - shopsmart-data:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  shopsmart-data:
